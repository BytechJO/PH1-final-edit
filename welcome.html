<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Playhouse Grade 1</title>
<style>
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#faa74b; }
body { font-family:Arial,sans-serif; }
.welcome { min-height:100vh; min-height:100svh; display:flex; justify-content:center; align-items:center; gap:clamp(15px,4vw,80px); padding:24px; }
.cover { width:min(66vw,88vh,850px); height:auto; display:block; }
.start-group { display:flex; align-items:center; gap:14px; }
.frog { width:clamp(80px,11vw,170px); height:auto; }
.start { display:inline-flex; align-items:center; justify-content:center; min-width:180px; padding:20px 38px; border:4px solid white; border-radius:50px; background:#00b8ed; color:white; text-decoration:none; font-size:clamp(30px,3.5vw,50px); font-weight:bold; box-shadow:0 7px 0 #1285b4; transition:transform .15s,box-shadow .15s; }
.start:hover { transform:translateY(-3px); box-shadow:0 10px 0 #1285b4; }
.start:active { transform:translateY(4px); box-shadow:0 3px 0 #1285b4; }
.start:focus-visible { outline:4px solid #523477; outline-offset:6px; }
@media(max-width:850px) { .welcome { flex-direction:column; gap:8px; padding:16px; } .cover { width:min(90vw,65svh,650px); } .frog { width:85px; } .start { min-width:170px; padding:15px 30px; } }
</style>
</head>
<body>
<main class="welcome">
  <img class="cover" src="./images/first-pageBac.png" alt="Playhouse Kids 1, Student’s Book, Second Edition">
  <div class="start-group">
    <img class="frog" src="./images/frog.png" alt="">
    <a class="start" href="./index.html?menu=1">Start</a>
  </div>
</main>
</body>
</html>
